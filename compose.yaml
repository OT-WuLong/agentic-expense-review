name: agentic-approval

services:
  bootstrap:
    build: .
    image: agentic-approval:local
    user: "0"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/agentic_approval
      MILVUS_URI: http://milvus:19530
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_database.py && python scripts/index_hybrid.py"]
    volumes:
      - ./data/indexes:/app/data/indexes
    depends_on:
      db:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: "no"

  app:
    image: agentic-approval:local
    env_file: .env
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-flash}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-48000}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/agentic_approval
      MILVUS_URI: http://milvus:19530
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/tmp/uploads
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  https:
    image: public.ecr.aws/docker/library/caddy:2.10-alpine
    profiles: ["https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: agentic-approval-db
    environment:
      POSTGRES_DB: agentic_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_approval"]
      interval: 2s
      timeout: 3s
      retries: 15

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: agentic-approval-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: agentic-approval-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.24
    container_name: agentic-approval-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 10

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
  postgres_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
